[project]
name = "llm-inference-gateway"
version = "0.1.0"
description = "OpenAI-compatible FastAPI gateway for self-hosted LLM inference"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "structlog>=24.2.0",
    "prometheus-client>=0.20.0",
    "redis>=5.0.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "bcrypt>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "black>=24.4.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]

[tool.hatch.build.targets.wheel]
# gateway/ is the package; pyproject.toml lives inside it, so package root is the parent dir
sources = [".."]
packages = ["gateway"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
